<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Orca injects its colors as --orca-* custom properties and sets light or dark on <html>. */
      :root {
        --fg: var(--orca-foreground, #e4e4e7);
        --muted: var(--orca-muted-foreground, #a1a1aa);
        --border: var(--orca-border, rgba(127, 127, 127, 0.25));
        --hover: var(--orca-accent, rgba(127, 127, 127, 0.12));
        --card: var(--orca-card, rgba(127, 127, 127, 0.06));
        --radius: var(--orca-radius, 6px);
        --ok: #2ea043;
        --warn: #d29922;
        --bad: var(--orca-destructive, #e5484d);
        --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 10px 6px 12px;
        font: 12px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--fg);
        background: var(--orca-background, transparent);
        -webkit-font-smoothing: antialiased;
      }
      .muted {
        color: var(--muted);
      }
      .mono {
        font-family: var(--mono);
        font-size: 11px;
      }
      .clip {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dot {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }
      .ok {
        --tone: var(--ok);
      }
      .warn {
        --tone: var(--warn);
      }
      .bad {
        --tone: var(--bad);
      }
      .dot.ok,
      .dot.warn,
      .dot.bad {
        background: var(--tone);
      }

      header {
        padding: 0 6px 10px;
      }
      .heading {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .heading strong {
        flex: 1;
        font-size: 13px;
        font-weight: 600;
      }
      .when {
        flex: none;
        font-size: 11px;
      }
      .refresh,
      .copy {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        margin: -3px -4px -3px 0;
        padding: 0;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .refresh:hover:not(:disabled),
      .copy:hover {
        background: var(--hover);
        color: var(--fg);
      }
      .copy {
        width: 20px;
        height: 20px;
        margin: -2px -4px -2px 0;
      }
      .copy svg {
        width: 13px;
        height: 13px;
      }
      .copy.ok,
      .copy.bad {
        color: var(--tone);
      }
      .refresh:disabled {
        cursor: default;
      }
      .refresh svg {
        width: 14px;
        height: 14px;
      }
      .refresh.spinning svg {
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .sub {
        margin-top: 1px;
        padding-left: 14px;
        font-size: 11px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 0 6px 10px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 0 7px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 11px;
        line-height: 18px;
        color: var(--muted);
      }
      .chip.ok,
      .chip.warn,
      .chip.bad {
        color: var(--tone);
        border-color: color-mix(in srgb, var(--tone) 45%, transparent);
      }
      .notice {
        margin: 0 6px 10px;
        padding: 6px 9px;
        border-left: 2px solid var(--tone, var(--muted));
        border-radius: 0 var(--radius) var(--radius) 0;
        background: var(--card);
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      details {
        border-top: 1px solid var(--border);
        padding: 2px 0;
      }
      summary {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 6px;
        border-radius: var(--radius);
        cursor: pointer;
        list-style: none;
        user-select: none;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }
      summary:hover {
        background: var(--hover);
        color: var(--fg);
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::before {
        content: '';
        flex: none;
        width: 5px;
        height: 5px;
        margin: 0 3px 0 2px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg);
        transition: transform 0.12s;
      }
      details[open] > summary::before {
        transform: rotate(45deg);
      }
      summary .label {
        flex: 1;
      }
      summary .count {
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
      }
      summary .count.ok,
      summary .count.warn,
      summary .count.bad {
        color: var(--tone);
      }

      /* Trail cards, after Entire's web view. */
      .card {
        margin: 4px 6px 8px;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 2px);
        background: var(--card);
        overflow: hidden;
      }
      .pad {
        padding: 8px 10px;
      }
      .spread {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
      }
      .spread.gap {
        margin: 6px 0;
      }
      .tags {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .tag {
        min-width: 0;
        padding: 0 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 11px;
        line-height: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tag.fixed {
        flex: none;
      }
      .diff {
        flex: none;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .plus {
        color: var(--ok);
      }
      .minus {
        color: var(--bad);
      }
      .card-title {
        font-weight: 600;
      }
      .card .name {
        font-weight: 600;
      }
      .card .about {
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted);
      }
      .verdict {
        font-weight: 600;
        color: var(--tone, var(--muted));
      }
      .bar {
        display: flex;
        gap: 3px;
        margin: 6px 0 4px;
      }
      .bar span {
        flex: 1;
        height: 10px;
        border: 1px dashed var(--border);
        border-radius: 3px;
      }
      .bar span.ok,
      .bar span.warn,
      .bar span.bad {
        border-color: transparent;
        background: var(--tone);
      }
      details.gate-item {
        padding: 0;
      }
      .gate {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 6px 10px;
      }
      .gate-item > summary.gate {
        border-radius: 0;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0;
        text-transform: none;
        color: var(--fg);
      }
      .gate-item > summary::before {
        content: none;
      }
      /* The chevron sits at the end, after the reviewers' initials. */
      .gate-item > summary::after {
        content: '';
        flex: none;
        width: 5px;
        height: 5px;
        margin: 0 2px 0 2px;
        border-right: 1.5px solid var(--muted);
        border-bottom: 1.5px solid var(--muted);
        transform: rotate(-45deg);
        transition: transform 0.12s;
      }
      .gate-item[open] > summary::after {
        transform: rotate(45deg);
      }
      .gate-body {
        padding: 0 10px 8px 34px;
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .gate-body > * + * {
        margin-top: 5px;
      }
      .gate-body .notice {
        margin: 5px 0 0;
      }
      .gate-body .list {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .item .stack {
        flex: 1;
        min-width: 0;
      }
      /* A reviewer's comment, under their name. */
      .gate-body .reason {
        padding-left: 24px;
        color: var(--muted);
        white-space: pre-wrap;
      }
      .facts {
        color: var(--muted);
      }
      .facts .sep {
        padding: 0 4px;
        opacity: 0.6;
      }
      .gate svg {
        flex: none;
        width: 16px;
        height: 16px;
        color: var(--tone, var(--muted));
      }
      .gate .label {
        flex: none;
      }
      .gate .meta {
        flex: 1;
      }
      .people {
        display: flex;
        gap: 2px;
        flex: none;
      }
      .who {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--hover);
        font-size: 10px;
        font-weight: 600;
      }
      details.finding {
        padding: 0;
      }
      .finding > summary {
        display: block;
        padding: 8px 10px;
        border-radius: 0;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0;
        text-transform: none;
        color: var(--fg);
      }
      .finding > summary::before {
        content: none;
      }
      .finding-title {
        margin: 4px 0 2px;
      }
      .finding-body {
        padding: 0 10px 10px;
        font-size: 11px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .finding-body .reason {
        margin-top: 8px;
        padding: 6px 8px;
        border-left: 2px solid var(--tone, var(--border));
        border-radius: 0 4px 4px 0;
        background: var(--hover);
        color: var(--muted);
      }
      .finding-body .reason b {
        color: var(--tone, var(--fg));
      }
      .pill {
        flex: none;
        padding: 0 6px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 10px;
        line-height: 16px;
        color: var(--tone, var(--muted));
      }
      .heading-row {
        padding: 6px 6px 2px 22px;
      }
      .sev {
        flex: none;
        padding: 0 5px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--tone, var(--muted));
      }
      .body {
        padding-bottom: 6px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 4px 6px 4px 22px;
        border-radius: var(--radius);
      }
      .row:hover {
        background: var(--hover);
      }
      .stack {
        flex: 1;
        min-width: 0;
      }
      .meta {
        font-size: 11px;
        color: var(--muted);
      }
      .end {
        flex: none;
        font-size: 11px;
        color: var(--muted);
      }
      .mark {
        flex: none;
        width: 10px;
        text-align: center;
        font-size: 11px;
        color: var(--tone, var(--muted));
      }
      .clamp {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .trail {
        padding: 2px 6px 6px 22px;
      }
      .trail .name {
        font-weight: 500;
      }
      .trail .about {
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted);
      }
      .empty {
        padding: 2px 6px 4px 22px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .empty.bad {
        color: var(--bad);
      }

      .blank {
        padding: 18px 6px 14px;
      }
      .blank strong {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
        font-weight: 600;
      }
      footer {
        padding: 8px 6px 0;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
      }
      footer b {
        font-weight: 600;
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // A function scope keeps these names off window: as globals, `closed` or `status` would clash.
      ;(function () {
        'use strict'
        // Everything below comes from Entire and Orca and is untrusted: it only ever goes into textContent.
        // The worker's snapshots, { version, workspaces: [entry] }, newest first (src/worker/panel.mjs).
        var DATA = null
        var root = document.getElementById('root')
        // Sections the user opened or closed, kept across rerenders.
        var opened = {}
        var shown = null
        var last = { context: null, error: null }
        // Switching to a workspace whose entry is younger than this shows it without reading Entire.
        var SWITCH_FRESH_MS = 60000
        // The focused workspace is read again once its entry is this old.
        var AUTO_REFRESH_MS = 5 * 60000
        // Reading a WSL workspace takes up to ~20 seconds, one on a paired server over SSH longer.
        var READ_TIMEOUT_MS = 100000
        var reads = 0
        var refreshing = false
        var readError = null
        var focusedKey = null
        // The workspace the panel last asked about, and when.
        var asked = { key: null, at: 0 }

        function el(tag, className, text) {
          var node = document.createElement(tag)
          if (className) node.className = className
          if (text !== undefined && text !== null) node.textContent = String(text)
          return node
        }

        function add(parent) {
          for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i])
          return parent
        }

        function titled(node, title) {
          if (title) node.title = String(title)
          return node
        }

        function ago(iso) {
          var seconds = (Date.now() - Date.parse(iso)) / 1000
          if (!isFinite(seconds)) return ''
          if (seconds < 60) return 'just now'
          if (seconds < 3600) return Math.floor(seconds / 60) + ' min ago'
          if (seconds < 86400) return Math.floor(seconds / 3600) + ' h ago'
          return Math.floor(seconds / 86400) + ' d ago'
        }

        function words(value) {
          return String(value).replace(/_/g, ' ')
        }

        function plural(count, one, many) {
          return count + ' ' + (count === 1 ? one : many)
        }

        function step(entry, key) {
          return (entry.steps || []).filter(function (s) {
            return s.key === key
          })[0]
        }

        function failing(entry) {
          return (
            Boolean(entry.problem) ||
            (entry.steps || []).some(function (s) {
              return !s.ok && !s.optional
            })
          )
        }

        function health(entry) {
          if (failing(entry)) return 'bad'
          var status = entry.data.status
          return status && !status.enabled ? 'warn' : 'ok'
        }

        // A <details> that stays open or closed across rerenders, which rebuild the panel every minute.
        function disclosure(id, className, openByDefault) {
          var details = el('details', className)
          details.open = Object.prototype.hasOwnProperty.call(opened, id) ? opened[id] : Boolean(openByDefault)
          details.addEventListener('toggle', function () {
            opened[id] = details.open
          })
          return details
        }

        function section(id, label, count, body, openByDefault) {
          var summary = add(el('summary'), el('span', 'label', label), typeof count === 'string' ? el('span', 'count', count) : count)
          return add(disclosure(id, null, openByDefault), summary, add(el('div', 'body'), body))
        }

        function row(mark, main, meta, end) {
          return add(el('div', 'row'), mark, add(el('div', 'stack'), main, meta), end)
        }

        function icon(paths) {
          var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
          svg.setAttribute('viewBox', '0 0 24 24')
          svg.setAttribute('fill', 'none')
          svg.setAttribute('stroke', 'currentColor')
          svg.setAttribute('stroke-width', '2')
          svg.setAttribute('stroke-linecap', 'round')
          svg.setAttribute('stroke-linejoin', 'round')
          paths.forEach(function (d) {
            var path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
            path.setAttribute('d', d)
            svg.appendChild(path)
          })
          return svg
        }

        function refreshButton() {
          var busy = reads > 0
          var button = titled(el('button', 'refresh' + (busy ? ' spinning' : '')), busy ? 'Reading Entire…' : 'Refresh')
          button.type = 'button'
          button.setAttribute('aria-label', 'Refresh')
          button.disabled = refreshing
          button.appendChild(icon(['M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8', 'M21 3v5h-5']))
          button.addEventListener('click', function () {
            ask(0, true)
            rerender()
          })
          return button
        }

        // Asks the worker for its data, reading Entire first unless the focused workspace's entry is
        // younger than maxAgeMs (0 always reads). Orca starts the worker if it isn't running. render
        // calls this, so it leaves the first rerender to its caller.
        function ask(maxAgeMs, manual) {
          asked = { key: focusedKey, at: Date.now() }
          if (!orca.plugin || !orca.host.has('plugin.request')) {
            readError = { code: 'unknown_method', message: 'this Orca has no plugin.request. Entire for Orca needs Orca 1.4.246 or later.' }
            return
          }
          reads++
          if (manual) refreshing = true
          orca.plugin
            .request('entire.read', { maxAgeMs: maxAgeMs }, { timeoutMs: READ_TIMEOUT_MS })
            .then(
              function (data) {
                DATA = data
                readError = null
              },
              function (error) {
                readError = error
              }
            )
            .then(function () {
              reads--
              if (manual) refreshing = false
              rerender()
            })
        }

        // The worker posts entire.changed after a read nobody here asked for: a command, or an agent
        // finishing. Its data comes back through a request, since a post carries at most 256 KiB.
        function fetchData() {
          orca.plugin.request('entire.data', {}).then(
            function (data) {
              DATA = data
              // The worker just read Entire, so an earlier failure no longer describes it.
              readError = null
              rerender()
            },
            function () {}
          )
        }

        function header(context, entry) {
          var heading = add(el('div', 'heading'), el('span', 'dot ' + (entry ? health(entry) : '')), el('strong', 'clip', context.displayName))
          if (reads > 0) add(heading, el('span', 'when muted', 'Checking…'))
          else if (entry) add(heading, titled(el('span', 'when muted', ago(entry.at)), 'Read from Entire ' + new Date(entry.at).toLocaleString()))
          add(heading, refreshButton())
          var where = entry && entry.workspace.where
          // Orca gives a paired server's workspace no branch; the worker reads it from the server.
          var server = entry && entry.workspace.server
          var branch = context.branch || (server && server.branch) || ''
          return add(
            el('header'),
            heading,
            branch && branch !== context.displayName ? el('div', 'sub mono muted clip', branch) : null,
            where ? titled(el('div', 'sub muted clip', where), where) : null
          )
        }

        function chips(status) {
          var list = el('div', 'chips')
          add(list, el('span', 'chip ' + (status.enabled ? 'ok' : 'warn'), status.enabled ? 'Enabled' : 'Not enabled'))
          ;(status.agents || []).forEach(function (agent) {
            add(list, el('span', 'chip', agent))
          })
          if (status.unpushed_checkpoints)
            add(list, titled(el('span', 'chip', status.unpushed_checkpoints + ' unpushed'), status.checkpoint_push_policy && words(status.checkpoint_push_policy) + ' push to ' + (status.checkpoint_sync_remote || 'origin')))
          return list
        }

        function notices(entry) {
          var status = entry.data.status || {}
          var hooks = status.codex_hooks && status.codex_hooks.state
          var list = []
          if (entry.problem) list.push(el('div', 'notice bad', entry.problem))
          if (status.checkpoint_sync_error) list.push(el('div', 'notice bad', 'Checkpoint sync: ' + status.checkpoint_sync_error))
          if (hooks && hooks !== 'ok') list.push(el('div', 'notice warn', 'Codex hooks are ' + words(hooks) + '.'))
          return list
        }

        function sessions(status) {
          var body = el('div')
          ;(status.active_sessions || []).forEach(function (session) {
            add(
              body,
              row(
                el('span', 'dot ' + (session.status === 'active' ? 'ok' : '')),
                el('div', 'clip', session.agent || 'Agent'),
                el('div', 'meta clip', [session.branch, session.status].filter(Boolean).join(' · ')),
                titled(el('span', 'end clip', session.model), session.model)
              )
            )
          })
          return body
        }

        function sentence(value) {
          var text = words(value)
          return text.charAt(0).toUpperCase() + text.slice(1)
        }

        // Gate and check outcomes as a tone: passed, failed, or still to come.
        function tone(status, blocking) {
          if (/^(passed|success|completed|approved)$/.test(status)) return 'ok'
          if (/^(failed|failure|error|changes_requested)$/.test(status)) return blocking === false ? 'warn' : 'bad'
          if (/^(running|in_progress|queued)$/.test(status)) return 'warn'
          return ''
        }

        // Entire's web view marks each gate with a ringed check, cross or dashed ring.
        function statusIcon(kind) {
          var ring = 'M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20'
          if (kind === 'ok') return icon([ring, 'm8 12 3 3 5-6'])
          if (kind === 'bad' || kind === 'warn') return icon([ring, 'M15 9l-6 6', 'M9 9l6 6'])
          var svg = icon([ring])
          svg.setAttribute('stroke-dasharray', '3 3')
          return svg
        }

        function person(login) {
          return titled(el('span', 'who', String(login).charAt(0).toUpperCase()), login)
        }

        // Merged, Ready to merge, Blocked or Not ready, with the line under it.
        function mergeState(value) {
          var merge = value.merge
          var blocking = merge
            ? merge.gates.filter(function (gate) {
                return gate.blocking && gate.status === 'failed'
              }).length
            : 0
          if (value.changeStatus === 'merged') return { tone: 'ok', badge: 'Merged', title: 'Merged', line: 'Changes were merged into ' + (value.base || 'the base branch') + '.' }
          if (value.status === 'closed' || value.changeStatus === 'closed') return { tone: '', badge: 'Closed', title: 'Closed', line: 'This change is closed.' }
          if (merge && merge.mergeable) return { tone: 'ok', badge: 'Ready', title: 'Ready to merge', line: 'Every required gate passed.' }
          if (blocking) return { tone: 'bad', badge: 'Blocked', title: 'Blocked', line: plural(blocking, 'gate needs', 'gates need') + ' attention.' }
          return { tone: 'warn', badge: 'Open', title: 'Not ready yet', line: 'Some gates have not finished.' }
        }

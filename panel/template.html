<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Orca injects its colors as --orca-* custom properties and sets light or dark on <html>. */
      :root {
        --fg: var(--orca-foreground, #e4e4e7);
        --muted: var(--orca-muted-foreground, #a1a1aa);
        --border: var(--orca-border, rgba(127, 127, 127, 0.25));
        --hover: var(--orca-accent, rgba(127, 127, 127, 0.12));
        --card: var(--orca-card, rgba(127, 127, 127, 0.06));
        --radius: var(--orca-radius, 6px);
        --ok: #2ea043;
        --warn: #d29922;
        --bad: var(--orca-destructive, #e5484d);
        --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 10px 6px 12px;
        font: 12px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--fg);
        background: var(--orca-background, transparent);
        -webkit-font-smoothing: antialiased;
      }
      .muted {
        color: var(--muted);
      }
      .mono {
        font-family: var(--mono);
        font-size: 11px;
      }
      .clip {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dot {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }
      .ok {
        --tone: var(--ok);
      }
      .warn {
        --tone: var(--warn);
      }
      .bad {
        --tone: var(--bad);
      }
      .dot.ok,
      .dot.warn,
      .dot.bad {
        background: var(--tone);
      }

      header {
        padding: 0 6px 10px;
      }
      .heading {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .heading strong {
        flex: 1;
        font-size: 13px;
        font-weight: 600;
      }
      .when {
        flex: none;
        font-size: 11px;
      }
      .refresh {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        margin: -3px -4px -3px 0;
        padding: 0;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .refresh:hover:not(:disabled) {
        background: var(--hover);
        color: var(--fg);
      }
      .refresh:disabled {
        cursor: default;
      }
      .refresh svg {
        width: 14px;
        height: 14px;
      }
      .refresh.spinning svg {
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .sub {
        margin-top: 1px;
        padding-left: 14px;
        font-size: 11px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 0 6px 10px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 0 7px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 11px;
        line-height: 18px;
        color: var(--muted);
      }
      .chip.ok,
      .chip.warn,
      .chip.bad {
        color: var(--tone);
        border-color: color-mix(in srgb, var(--tone) 45%, transparent);
      }
      .notice {
        margin: 0 6px 10px;
        padding: 6px 9px;
        border-left: 2px solid var(--tone, var(--muted));
        border-radius: 0 var(--radius) var(--radius) 0;
        background: var(--card);
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      details {
        border-top: 1px solid var(--border);
        padding: 2px 0;
      }
      summary {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 6px;
        border-radius: var(--radius);
        cursor: pointer;
        list-style: none;
        user-select: none;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }
      summary:hover {
        background: var(--hover);
        color: var(--fg);
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::before {
        content: '';
        flex: none;
        width: 5px;
        height: 5px;
        margin: 0 3px 0 2px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg);
        transition: transform 0.12s;
      }
      details[open] > summary::before {
        transform: rotate(45deg);
      }
      summary .label {
        flex: 1;
      }
      summary .count {
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
      }
      summary .count.ok,
      summary .count.warn,
      summary .count.bad {
        color: var(--tone);
      }

      /* Trail cards, after Entire's web view. */
      .card {
        margin: 4px 6px 8px;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 2px);
        background: var(--card);
        overflow: hidden;
      }
      .pad {
        padding: 8px 10px;
      }
      .spread {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
      }
      .spread.gap {
        margin: 6px 0;
      }
      .tags {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .tag {
        min-width: 0;
        padding: 0 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 11px;
        line-height: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tag.fixed {
        flex: none;
      }
      .diff {
        flex: none;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .plus {
        color: var(--ok);
      }
      .minus {
        color: var(--bad);
      }
      .card-title {
        font-weight: 600;
      }
      .card .name {
        font-weight: 600;
      }
      .card .about {
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted);
      }
      .verdict {
        font-weight: 600;
        color: var(--tone, var(--muted));
      }
      .bar {
        display: flex;
        gap: 3px;
        margin: 6px 0 4px;
      }
      .bar span {
        flex: 1;
        height: 10px;
        border: 1px dashed var(--border);
        border-radius: 3px;
      }
      .bar span.ok,
      .bar span.warn,
      .bar span.bad {
        border-color: transparent;
        background: var(--tone);
      }
      .gate {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 6px 10px;
        border-top: 1px solid var(--border);
      }
      .gate svg {
        flex: none;
        width: 16px;
        height: 16px;
        color: var(--tone, var(--muted));
      }
      .gate .label {
        flex: none;
      }
      .gate .meta {
        flex: 1;
      }
      .people {
        display: flex;
        gap: 2px;
        flex: none;
      }
      .who {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--hover);
        font-size: 10px;
        font-weight: 600;
      }
      details.finding {
        padding: 0;
      }
      .finding > summary {
        display: block;
        padding: 8px 10px;
        border-radius: 0;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0;
        text-transform: none;
        color: var(--fg);
      }
      .finding > summary::before {
        content: none;
      }
      .finding-title {
        margin: 4px 0 2px;
      }
      .finding-body {
        padding: 0 10px 10px;
        font-size: 11px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .finding-body .reason {
        margin-top: 8px;
        padding: 6px 8px;
        border-left: 2px solid var(--tone, var(--border));
        border-radius: 0 4px 4px 0;
        background: var(--hover);
        color: var(--muted);
      }
      .finding-body .reason b {
        color: var(--tone, var(--fg));
      }
      .pill {
        flex: none;
        padding: 0 6px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 10px;
        line-height: 16px;
        color: var(--tone, var(--muted));
      }
      .heading-row {
        padding: 6px 6px 2px 22px;
      }
      .sev {
        flex: none;
        padding: 0 5px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--tone, var(--muted));
      }
      .body {
        padding-bottom: 6px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 4px 6px 4px 22px;
        border-radius: var(--radius);
      }
      .row:hover {
        background: var(--hover);
      }
      .stack {
        flex: 1;
        min-width: 0;
      }
      .meta {
        font-size: 11px;
        color: var(--muted);
      }
      .end {
        flex: none;
        font-size: 11px;
        color: var(--muted);
      }
      .mark {
        flex: none;
        width: 10px;
        text-align: center;
        font-size: 11px;
        color: var(--tone, var(--muted));
      }
      .clamp {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .trail {
        padding: 2px 6px 6px 22px;
      }
      .trail .name {
        font-weight: 500;
      }
      .trail .about {
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted);
      }
      .empty {
        padding: 2px 6px 4px 22px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .empty.bad {
        color: var(--bad);
      }

      .blank {
        padding: 18px 6px 14px;
      }
      .blank strong {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
        font-weight: 600;
      }
      footer {
        padding: 8px 6px 0;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
      }
      footer b {
        font-weight: 600;
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- The worker writes each snapshot here (src/worker/panel.mjs). Do not edit panel/entire.html. -->
    <script id="entire-data" type="application/json">null</script>
    <script>
      // A function scope keeps these names off window: as globals, `closed` or `status` would clash.
      ;(function () {
        'use strict'
        // Everything below comes from Entire and Orca and is untrusted: it only ever goes into textContent.
        var DATA = readData()
        var root = document.getElementById('root')
        // Sections the user opened or closed. Orca remounts the panel on each update, which resets it.
        var opened = {}
        var shown = null
        var last = { context: null, error: null }
        // src/worker/refresh-requests.mjs listens for exactly this title.
        var REFRESH_TITLE = 'Entire: refreshing the panel'
        // A refresh normally remounts the panel within a few seconds; after this long, assume it won't.
        var REFRESH_WAIT_MS = 12000
        var refreshing = false
        var refreshHint = null
        // The worker reads a workspace focus moves to unless the entry this panel shows for it is under a
        // minute old (SWITCH_FRESH_MS and shownAt in src/worker), then rewrites the panel. Reading a WSL workspace
        // takes up to ~20 seconds; after this long, assume the worker isn't running.
        var SWITCH_FRESH_MS = 60000
        var CHECK_WAIT_MS = 45000
        var focusedKey = null
        var checkingSince = null

        function readData() {
          try {
            return JSON.parse(document.getElementById('entire-data').textContent)
          } catch (_) {
            return null
          }
        }

        function el(tag, className, text) {
          var node = document.createElement(tag)
          if (className) node.className = className
          if (text !== undefined && text !== null) node.textContent = String(text)
          return node
        }

        function add(parent) {
          for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i])
          return parent
        }

        function titled(node, title) {
          if (title) node.title = String(title)
          return node
        }

        function ago(iso) {
          var seconds = (Date.now() - Date.parse(iso)) / 1000
          if (!isFinite(seconds)) return ''
          if (seconds < 60) return 'just now'
          if (seconds < 3600) return Math.floor(seconds / 60) + ' min ago'
          if (seconds < 86400) return Math.floor(seconds / 3600) + ' h ago'
          return Math.floor(seconds / 86400) + ' d ago'
        }

        function words(value) {
          return String(value).replace(/_/g, ' ')
        }

        function plural(count, one, many) {
          return count + ' ' + (count === 1 ? one : many)
        }

        function step(entry, key) {
          return (entry.steps || []).filter(function (s) {
            return s.key === key
          })[0]
        }

        function failing(entry) {
          return (
            Boolean(entry.problem) ||
            (entry.steps || []).some(function (s) {
              return !s.ok && !s.optional
            })
          )
        }

        function health(entry) {
          if (failing(entry)) return 'bad'
          var status = entry.data.status
          return status && !status.enabled ? 'warn' : 'ok'
        }

        function section(id, label, count, body, openByDefault) {
          var details = el('details')
          details.open = Object.prototype.hasOwnProperty.call(opened, id) ? opened[id] : openByDefault
          details.addEventListener('toggle', function () {
            opened[id] = details.open
          })
          var summary = add(el('summary'), el('span', 'label', label), typeof count === 'string' ? el('span', 'count', count) : count)
          return add(details, summary, add(el('div', 'body'), body))
        }

        function row(mark, main, meta, end) {
          return add(el('div', 'row'), mark, add(el('div', 'stack'), main, meta), end)
        }

        function icon(paths) {
          var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
          svg.setAttribute('viewBox', '0 0 24 24')
          svg.setAttribute('fill', 'none')
          svg.setAttribute('stroke', 'currentColor')
          svg.setAttribute('stroke-width', '2')
          svg.setAttribute('stroke-linecap', 'round')
          svg.setAttribute('stroke-linejoin', 'round')
          paths.forEach(function (d) {
            var path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
            path.setAttribute('d', d)
            svg.appendChild(path)
          })
          return svg
        }

        function refreshButton() {
          var busy = refreshing || checkingSince !== null
          var button = titled(el('button', 'refresh' + (busy ? ' spinning' : '')), busy ? 'Refreshing…' : 'Refresh')
          button.type = 'button'
          button.setAttribute('aria-label', 'Refresh')
          button.disabled = refreshing
          button.appendChild(icon(['M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8', 'M21 3v5h-5']))
          button.addEventListener('click', requestRefresh)
          return button
        }

        // The worker hears this notification through Orca's audit log, refreshes, and Orca remounts the
        // panel with the new data, which ends this document. Still here later means the worker isn't running.
        function requestRefresh() {
          refreshing = true
          refreshHint = null
          rerender()
          orca.host.call('notifications.show', { title: REFRESH_TITLE }).then(
            function () {
              setTimeout(function () {
                refreshing = false
                refreshHint =
                  "Nothing refreshed: the plugin's worker isn't running. Run Entire: Refresh panel from the command palette once, and ↻ works until Orca quits."
                rerender()
              }, REFRESH_WAIT_MS)
            },
            function (error) {
              refreshing = false
              refreshHint = "Couldn't ask for a refresh: " + error.code + ': ' + error.message
              rerender()
            }
          )
        }

        function header(context, entry) {
          var heading = add(el('div', 'heading'), el('span', 'dot ' + (entry ? health(entry) : '')), el('strong', 'clip', context.displayName))
          if (checkingSince !== null) add(heading, el('span', 'when muted', 'Checking…'))
          else if (entry) add(heading, titled(el('span', 'when muted', ago(entry.at)), 'Read from Entire ' + new Date(entry.at).toLocaleString()))
          add(heading, refreshButton())
          var where = entry && entry.workspace.where
          return add(
            el('header'),
            heading,
            context.branch !== context.displayName ? el('div', 'sub mono muted clip', context.branch) : null,
            where ? titled(el('div', 'sub muted clip', where), where) : null
          )
        }

        function chips(status) {
          var list = el('div', 'chips')
          add(list, el('span', 'chip ' + (status.enabled ? 'ok' : 'warn'), status.enabled ? 'Enabled' : 'Not enabled'))
          ;(status.agents || []).forEach(function (agent) {
            add(list, el('span', 'chip', agent))
          })
          if (status.unpushed_checkpoints)
            add(list, titled(el('span', 'chip', status.unpushed_checkpoints + ' unpushed'), status.checkpoint_push_policy && words(status.checkpoint_push_policy) + ' push to ' + (status.checkpoint_sync_remote || 'origin')))
          return list
        }

        function notices(entry) {
          var status = entry.data.status || {}
          var hooks = status.codex_hooks && status.codex_hooks.state
          var list = []
          if (entry.problem) list.push(el('div', 'notice bad', entry.problem))
          if (status.checkpoint_sync_error) list.push(el('div', 'notice bad', 'Checkpoint sync: ' + status.checkpoint_sync_error))
          if (hooks && hooks !== 'ok') list.push(el('div', 'notice warn', 'Codex hooks are ' + words(hooks) + '.'))
          return list
        }

        function sessions(status) {
          var body = el('div')
          ;(status.active_sessions || []).forEach(function (session) {
            add(
              body,
              row(
                el('span', 'dot ' + (session.status === 'active' ? 'ok' : '')),
                el('div', 'clip', session.agent || 'Agent'),
                el('div', 'meta clip', [session.branch, session.status].filter(Boolean).join(' · ')),
                titled(el('span', 'end clip', session.model), session.model)
              )
            )
          })
          return body
        }

        function sentence(value) {
          var text = words(value)
          return text.charAt(0).toUpperCase() + text.slice(1)
        }

        // Gate and check outcomes as a tone: passed, failed, or still to come.
        function tone(status, blocking) {
          if (/^(passed|success|completed|approved)$/.test(status)) return 'ok'
          if (/^(failed|failure|error|changes_requested)$/.test(status)) return blocking === false ? 'warn' : 'bad'
          if (/^(running|in_progress|queued)$/.test(status)) return 'warn'
          return ''
        }

        // Entire's web view marks each gate with a ringed check, cross or dashed ring.
        function statusIcon(kind) {
          var ring = 'M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20'
          if (kind === 'ok') return icon([ring, 'm8 12 3 3 5-6'])
          if (kind === 'bad' || kind === 'warn') return icon([ring, 'M15 9l-6 6', 'M9 9l6 6'])
          var svg = icon([ring])
          svg.setAttribute('stroke-dasharray', '3 3')
          return svg
        }

        function person(login) {
          return titled(el('span', 'who', String(login).charAt(0).toUpperCase()), login)
        }

        // Merged, Ready to merge, Blocked or Not ready, with the line under it.
        function mergeState(value) {
          var merge = value.merge
          var blocking = merge
            ? merge.gates.filter(function (gate) {
                return gate.blocking && gate.status === 'failed'
              }).length
            : 0
          if (value.changeStatus === 'merged') return { tone: 'ok', badge: 'Merged', title: 'Merged', line: 'Changes were merged into ' + (value.base || 'the base branch') + '.' }
          if (value.status === 'closed' || value.changeStatus === 'closed') return { tone: '', badge: 'Closed', title: 'Closed', line: 'This change is closed.' }
          if (merge && merge.mergeable) return { tone: 'ok', badge: 'Ready', title: 'Ready to merge', line: 'Every required gate passed.' }
          if (blocking) return { tone: 'bad', badge: 'Blocked', title: 'Blocked', line: plural(blocking, 'gate needs', 'gates need') + ' attention.' }
          return { tone: 'warn', badge: 'Open', title: 'Not ready yet', line: 'Some gates have not finished.' }
        }

        function trailBadge(value) {
          if (!value) return ''
          var state = mergeState(value)
          return el('span', 'count ' + state.tone, state.badge)
        }

        function changeCard(value) {
          var who = [value.author, ago(value.mergedAt || value.createdAt)].filter(Boolean).join(' · ')
          var where = add(el('div', 'spread'), add(el('div', 'tags'), value.repository ? titled(el('span', 'tag', value.repository), value.repository) : null, value.change ? el('span', 'tag fixed', '#' + value.change) : null), el('span', 'meta clip', who))
          var branches = add(el('div', 'tags'), value.branch ? titled(el('span', 'tag', value.branch), value.branch) : null, value.base ? el('span', 'muted', '→') : null, value.base ? el('span', 'tag fixed', value.base) : null)
          var diff = value.diff
            ? titled(add(el('span', 'diff'), el('span', 'plus', '+' + value.diff.additions), document.createTextNode(' / '), el('span', 'minus', '−' + value.diff.deletions)), plural(value.diff.files, 'file', 'files') + ' changed')
            : null
          var facts = [value.type && sentence(value.type), value.priority && sentence(value.priority) + ' priority', value.changes.length > 1 ? plural(value.changes.length, 'change', 'changes') : null]
          return add(
            el('div', 'card'),
            add(
              el('div', 'pad'),
              where,
              add(el('div', 'spread gap'), branches, diff),
              titled(el('div', 'name clamp', value.title || 'Untitled trail'), value.title),
              el('div', 'meta', facts.filter(Boolean).join(' · ')),
              value.body ? titled(el('div', 'about clamp', value.body), value.body) : null
            )
          )
        }

        // One bar segment per reviewer, filled once it finished, red when it found something blocking.
        function reviewCard(review) {
          // The worker decides the verdict as Entire's web view does (src/worker/trail.mjs).
          var verdict = {
            pass: { tone: 'ok', text: 'Pass' },
            fail: { tone: 'bad', text: 'Fail' },
            running: { tone: 'warn', text: 'Reviewing' }
          }[review.verdict] || { tone: '', text: 'Not run' }
          var bar = el('div', 'bar')
          var reviewers = review.reviewers.length ? review.reviewers : [null]
          reviewers.forEach(function (reviewer) {
            var found = reviewer ? reviewer.blocking + reviewer.nonBlocking : 0
            var kind = !reviewer ? '' : found ? 'bad' : tone(reviewer.status)
            add(bar, titled(el('span', kind), reviewer && reviewer.name + ': ' + words(reviewer.status) + (found ? ', ' + plural(found, 'finding', 'findings') + (reviewer.blocking ? ' (' + reviewer.blocking + ' blocking)' : ', none blocking') : '')))
          })
          var counts = review.severity
          var found = counts.high + counts.medium + counts.low
          var detail = review.reviewers.length
            ? review.reviewers
                .map(function (reviewer) {
                  return reviewer.name
                })
                .join(' · ') + (found ? ' · ' + [counts.high + ' high', counts.medium + ' medium', counts.low + ' low'].join(', ') : ' · nothing found')
            : 'No review has run on this version yet.'
          return add(el('div', 'card'), add(el('div', 'pad'), add(el('div', 'spread'), el('span', 'card-title', 'Code review'), el('span', 'verdict ' + verdict.tone, verdict.text)), bar, el('div', 'meta clip', detail)))
        }

        function mergeCard(value) {
          var state = mergeState(value)
          var card = add(el('div', 'card'), add(el('div', 'pad'), el('div', 'card-title', state.title), el('div', 'meta', state.line)))
          var merge = value.merge
          if (!merge) return card
          if (merge.conflicts) add(card, gateRow({ key: 'conflicts', status: 'failed', blocking: true, summary: words(merge.conflicts), people: [] }))
          merge.gates.forEach(function (gate) {
            add(card, gateRow(gate))
          })
          return card
        }

        function gateRow(gate) {
          var kind = gate.status === 'passed' ? 'ok' : gate.status === 'failed' ? (gate.blocking ? 'bad' : 'warn') : ''
          var people = el('span', 'people')
          ;(gate.people || []).slice(0, 4).forEach(function (login) {
            add(people, person(login))
          })
          return titled(add(el('div', 'gate ' + kind), statusIcon(kind), el('span', 'label', sentence(gate.key)), gate.summary ? el('span', 'meta clip', gate.summary) : el('span', 'clip'), people), gate.rationale)
        }

        function findingsList(findings) {
          var counts = [findings.open + ' open', findings.resolved ? findings.resolved + ' resolved' : null, findings.dismissed ? findings.dismissed + ' dismissed' : null]
          var body = add(el('div'), add(el('div', 'spread heading-row'), el('span', 'card-title', 'Findings'), el('span', 'meta', counts.filter(Boolean).join(' · '))))
          if (!findings.items.length) return add(body, el('div', 'empty', 'No findings on this branch.'))
          findings.items.forEach(function (finding) {
            add(body, findingCard(finding))
          })
          return body
        }

        // Collapsed: severity, status, confidence, the defect and where. Open: the agent's full text and
        // how the finding was resolved or why it was dismissed.
        function findingCard(finding) {
          var severity = finding.severity ? el('span', 'sev ' + (finding.severity === 'high' ? 'bad' : finding.severity === 'medium' ? 'warn' : ''), finding.severity) : null
          var status = finding.status && finding.status !== 'open' ? el('span', 'pill ' + (finding.status === 'resolved' ? 'ok' : ''), sentence(finding.status)) : null
          var stale = finding.stale ? titled(el('span', 'pill', 'Stale'), 'Found on an earlier version of the code') : null
          var confidence = typeof finding.confidence === 'number' ? titled(el('span', 'meta', Math.round(finding.confidence * 100) + '%'), 'Confidence') : null
          var range = finding.line ? ':' + finding.line + (finding.endLine && finding.endLine !== finding.line ? '–' + finding.endLine : '') : ''
          var where = finding.file ? finding.file + range : null
          var summary = add(
            el('summary'),
            add(el('div', 'spread'), add(el('div', 'tags'), severity, status, stale), confidence),
            el('div', 'finding-title clamp', finding.title || 'Finding'),
            where ? titled(el('div', 'meta mono clip', where), where) : null
          )
          var text = finding.body && finding.body !== finding.title ? el('div', 'text', finding.body) : null
          var reason = finding.reason ? add(el('div', 'reason ' + (finding.status === 'resolved' ? 'ok' : '')), el('b', null, sentence(finding.status || 'note') + ': '), document.createTextNode(finding.reason)) : null
          return add(el('details', 'finding card'), summary, text || reason ? add(el('div', 'finding-body'), text, reason) : null)
        }

        // The worker summarizes `entire trail show` and `entire trail finding list` (src/worker/trail.mjs).
        function trail(entry) {
          var value = entry.data.trail
          if (!value) {
            var s = step(entry, 'trail')
            var missing = !s || /no discoverable|no trail/i.test(s.text)
            return titled(el('div', missing ? 'empty' : 'empty bad', missing ? 'No trail for this branch.' : s.text), s && s.text)
          }
          var body = add(el('div'), changeCard(value))
          if (value.merge && value.merge.review) add(body, reviewCard(value.merge.review))
          add(body, mergeCard(value))
          if (value.findings) add(body, findingsList(value.findings))
          value.changes
            .filter(function (change) {
              return !change.current
            })
            .forEach(function (change) {
              add(body, row(el('span', 'mark', '⎇'), el('div', 'clip', change.repository + ' · ' + change.branch), el('div', 'meta clip', words(change.status || ''))))
            })
          return body
        }

        function checkpoints(list) {
          if (!list.length) return el('div', 'empty', 'No checkpoints on this branch yet.')
          var body = el('div')
          list.forEach(function (checkpoint) {
            var id = String(checkpoint.checkpoint_id || '')
            var meta = add(el('div', 'meta clip'), document.createTextNode([checkpoint.agent, ago(checkpoint.date)].filter(Boolean).join(' · ') + ' · '), el('span', 'mono', id.slice(0, 8)))
            add(body, titled(row(null, el('div', 'clip', checkpoint.message || '(no message)'), meta), (checkpoint.message || '') + '\n' + id))
          })
          return body
        }

        function connection(entry) {
          var body = el('div')
          var workspace = entry.workspace
          if (workspace.where) add(body, row(el('span', 'mark ok', '✓'), el('div', 'clip', 'Workspace'), el('div', 'meta clip', 'found via ' + workspace.via)))
          ;(entry.steps || []).forEach(function (s) {
            var tone = s.ok ? 'ok' : s.optional ? '' : 'bad'
            var mark = el('span', 'mark ' + tone, s.ok ? '✓' : s.optional ? '–' : '✕')
            add(body, titled(row(mark, el('div', 'clip', s.label), el('div', 'meta clip', s.text), s.ok ? el('span', 'end', s.ms + ' ms') : null), s.text))
          })
          return body
        }

        function blank(title, text) {
          return add(el('div', 'blank'), el('strong', null, title), el('div', 'muted', text))
        }

        function footer() {
          return add(
            el('footer'),
            document.createTextNode('Checks Entire when you switch here, when an agent finishes and every 5 minutes. To check now, use ↻ or '),
            el('b', null, 'Entire: Refresh panel'),
            document.createTextNode('.')
          )
        }

        function rerender() {
          shown = null
          render(last.context, last.error)
        }

        function render(context, error) {
          last = { context: context, error: error }
          var entry = context ? findEntry(context) : null
          noteSwitch(context, entry)
          var signature = JSON.stringify([context, entry && entry.at, error && error.code, refreshing, refreshHint, checkingSince, Math.floor(Date.now() / 60000)])
          if (signature === shown) return
          shown = signature
          root.textContent = ''

          if (error) return add(root, blank("Can't read the workspace", error.code + ': ' + error.message), footer())
          if (!context) return add(root, blank('No workspace focused', 'Focus a workspace to see its Entire data.'), footer())
          add(root, header(context, entry))
          if (refreshHint) add(root, el('div', 'notice', refreshHint))
          if (!entry) {
            // Nothing written at all means the worker can't write here; otherwise this workspace is new to it.
            return add(
              root,
              DATA
                ? blank('Reading Entire for this workspace…', 'This takes a few seconds after you switch here. If nothing shows, use ↻.')
                : blank('No Entire data yet', 'The panel fills in only when Orca runs this plugin from a Development folder (Settings → Plugins → ⋯ → Development folders).'),
              footer()
            )
          }
          var status = entry.data.status
          if (status) add(root, chips(status))
          notices(entry).forEach(function (notice) {
            add(root, notice)
          })
          if (!entry.steps.length) return add(root, footer())

          var active = (status && status.active_sessions) || []
          if (active.length) add(root, section('sessions', 'Sessions', String(active.length), sessions(status), true))
          else if (!status) add(root, el('div', 'empty bad', (step(entry, 'status') || {}).text))
          var value = entry.data.trail
          add(root, section('trail', value && value.number ? 'Trail #' + value.number : 'Trail', trailBadge(value), trail(entry), true))
          var list = entry.data.checkpoints
          add(root, section('checkpoints', 'Checkpoints', list ? String(list.length) : '', list ? checkpoints(list) : el('div', 'empty bad', (step(entry, 'checkpoints') || {}).text), false))
          var bad = failing(entry)
          add(root, section('connection', 'Connection', el('span', 'count ' + (bad ? 'bad' : 'ok'), bad ? 'Problem' : 'OK'), connection(entry), bad), footer())
        }

        // A switch while this panel is up means the worker is about to read the new workspace, unless its
        // data is fresh. The rewrite remounts the panel, which ends the check; the first render after a
        // mount is no switch.
        function noteSwitch(context, entry) {
          var key = context
            ? JSON.stringify([
                context.displayName,
                context.branch,
                context.terminals
                  .map(function (terminal) {
                    return terminal.id
                  })
                  .sort()
              ])
            : null
          if (focusedKey !== null && key !== focusedKey) {
            var stale = !entry || !(Date.now() - Date.parse(entry.at) < SWITCH_FRESH_MS)
            checkingSince = key && stale ? Date.now() : null
          }
          focusedKey = key
          if (checkingSince !== null && Date.now() - checkingSince > CHECK_WAIT_MS) checkingSince = null
        }

        // Keep this the same as findShown in src/worker/panel.mjs.
        function findEntry(context) {
          var list = (DATA && DATA.workspaces) || []
          var ids = context.terminals.map(function (terminal) {
            return terminal.id
          })
          // A workspace keeps its terminals when it switches branch, so a snapshot from the old branch
          // shares them too: the branch has to match as well.
          var byTerminal = list.filter(function (entry) {
            return (
              entry.workspace.branch === context.branch &&
              entry.workspace.terminals.some(function (id) {
                return ids.indexOf(id) >= 0
              })
            )
          })[0]
          if (byTerminal) return byTerminal
          // Many repos share a name and branch such as main/main. Fall back on them only when terminals
          // can't tell the workspaces apart and exactly one entry matches.
          var byName = list.filter(function (entry) {
            var contradicted = ids.length > 0 && entry.workspace.terminals.length > 0
            return !contradicted && entry.workspace.name === context.displayName && entry.workspace.branch === context.branch
          })
          return byName.length === 1 ? byName[0] : null
        }

        // No event tells a panel that focus moved, so ask which workspace is focused every few seconds.
        function tick() {
          if (!orca.host.has('workspace.readContext')) {
            render(null, { code: 'unknown_method', message: 'this Orca has no workspace.readContext' })
            return
          }
          orca.host.call('workspace.readContext', {}).then(
            function (context) {
              render(context, null)
            },
            function (error) {
              render(null, error)
            }
          )
        }

        tick()
        setInterval(tick, 2000)
      })()
    </script>
  </body>
</html>
